# Incluído em cada location do site (ver default.conf.template).
# CSP: só scripts do próprio site; a API (HTTPS/WSS) e os tiles do mapa (imagens https) são os únicos destinos externos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
