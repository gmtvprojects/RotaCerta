packages:
  - apps/*
  - packages/*
allowBuilds:
  '@astryxdesign/cli': false
  '@astryxdesign/core': false
  esbuild: true
minimumReleaseAgeExclude:
  - '@ionic/core@9.0.12'
  - '@ionic/react-router@9.0.12'
  - '@ionic/react@9.0.12'
  - '@stencil/core@4.45.4'
packageExtensions:
  # o app web usa React 19; sem isto os tipos do Astryx resolveriam o @types/react 18 do app mobile (Ionic)
  '@astryxdesign/core':
    dependencies:
      '@types/react': 19.3.0
      '@types/react-dom': 19.3.0
