   ${loginCards.map(c=>`<button type="button" class="rc-auth-role" data-action="login-role" data-role="${c.key}" aria-pressed="${c.key===ui.roleLogin}" aria-label="Acessar como ${c.label}"><span class="rc-auth-role-icon">${icon(c.icon,17)}</span><span class="rc-auth-role-copy"><strong>${c.label}</strong><small>${c.desc}</small></span></button>`).join('')}</div></section>

function selectLoginRole(role){
 if(!roles.includes(role))return;
 ui.roleLogin=role;
 document.querySelectorAll('.rc-auth-role').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.role===role)));
}
function enterDemo(){
 if(!roles.includes(ui.roleLogin))return;
 // This is a local presentation gate, NOT authentication. Credentials are never
 // read, stored or sent. A production application needs server-side authentication.
 ui.demoEntered=true;
 ui.tour=-1;
 applyRole(ui.roleLogin);
}
function showAccessHelp(){
 showModal('Acesso de demonstração',`<div class="info-box">${icon('info',19)}<div><strong>Não é necessária uma senha real.</strong><br>Escolha um perfil e toque em Entrar. Os campos apenas representam o login do aplicativo.</div></div><p class="small muted" style="margin-top:16px;line-height:1.8">A recuperação de senha será conectada ao serviço de autenticação na versão de produção. Nenhum e-mail é enviado por este protótipo.</p>`,btn('Voltar ao acesso','close','primary'));
}
function toggleAccessPassword(button){
 const input=document.getElementById('rc-auth-password');if(!input)return;
 const show=input.type==='password';input.type=show?'text':'password';button.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');button.setAttribute('aria-pressed',String(show));
}

function dashboard(){
 const awaiting=state.orders.filter(o=>o.status==='awaiting').length,ready=state.orders.filter(o=>o.status==='ready').length,inroute=state.orders.filter(o=>o.status==='onroute').length,done=state.orders.filter(o=>o.status==='delivered').length;
 const active=state.routes.find(r=>r.status==='active'),progress=active?routeOrders(active).filter(terminal).length:0;
 const regionRows=state.zones.map((z,i)=>{const os=state.orders.filter(o=>o.status==='ready'&&zoneOf(o)===z),box=os.reduce((n,o)=>n+o.boxes.length,0),bs=state.neighborhoods.filter(b=>b.zone===z).map(b=>b.name).join(' · ');return `<div class="region-row"><div class="region-icon" style="${i===1?'background:#f0f6f2;color:#4b8c69':i===2?'background:#fff6ed;color:#c48c46':''}">${icon('pin',18)}</div><div class="grow"><strong>${esc(z)}</strong><small>${esc(bs)}</small></div><div class="zone-bar"><div class="bar"><span style="width:${Math.min(100,os.length/8*100)}%"></span></div><div class="statlabel">${box} caixas disponíveis</div></div><div style="text-align:right;min-width:30px"><strong>${os.length}</strong><small>entregas</small></div></div>`;}).join('');
 return `${header('A operação, em movimento.','Do caixa à porta do cliente. Tudo no mesmo lugar.',btn('Apresentar fluxo','tour','','play')+btn('Nova entrega','new','primary','plus'))}<div class="metrics">${metric('Entregas de hoje',state.orders.length,'Visão consolidada da loja','box')}${metric('Prontas para planejar',ready,`${awaiting} aguardando volumes`,'clipboard')}${metric('Em rota',inroute,`${state.routes.filter(r=>r.status==='active').length} veículo em operação`,'truck','blue')}${metric('Entregas concluídas',done,'<span class="green">Operação registrada</span>','checkcircle')}</div><div class="dashboard-grid"><section class="card"><div class="card-head"><h2>Onde estão as próximas entregas?</h2><button class="textbtn" data-action="goto" data-page="expedicao">Planejar carga ${icon('arrow',13)}</button></div>${regionRows}<div class="table-footer"><span>${icon('info',12)} Agrupamento por bairros conhecidos pela equipe.</span><span>Manual assistido</span></div></section><div class="dashboard-side"><section class="card"><div class="card-head"><h2>Viagens em andamento</h2><span class="pill blue">${state.routes.filter(r=>r.status==='active').length} ativa</span></div>${active?`<div class="route-highlight"><div class="flex between"><span class="tiny muted">ROMANEIO #${active.id}</span>${icon('truck',19)}</div><h3>${driver(active.driverId).name}</h3><div class="flex between" style="margin:8px 0 10px"><span class="tiny muted">${vehicle(active.vehicleId).name}</span><span class="tiny">${progress} de ${active.orders.length} paradas</span></div><div class="bar"><span style="width:${progress/active.orders.length*100}%"></span></div><button class="textbtn" data-action="open-driver" data-id="${active.id}" style="color:#b5c6ff;margin-top:11px">Acompanhar viagem ${icon('arrow',12)}</button></div>`:empty('Nenhuma viagem ativa')}${state.routes.filter(r=>r.status==='loading').slice(0,1).map(r=>`<div class="route-mini flex between"><div><strong class="tiny">${vehicle(r.vehicleId).name}</strong><p class="muted tiny" style="margin-top:3px">${r.orders.length} entregas · saída prevista ${r.departure}</p></div>${routeBadge(r.status)}</div>`).join('')}</section></div></div><div class="live-banner">${icon('message',20)}<div class="grow"><strong class="green">Uma entrega concluída. O próximo cliente avisado.</strong><p>O motorista altera o status. A automação cuida do aviso. Envios simulados neste protótipo.</p></div><button class="textbtn green" data-action="goto" data-page="notificacoes">Ver avisos ${icon('arrow',13)}</button></div><section class="card mt dashboard-table"><div class="card-head"><h2>Entregas em destaque</h2><button class="textbtn" data-action="goto" data-page="entregas">Ver todas ${icon('arrow',13)}</button></div>${orderTable([order(103),order(109),order(113),order(123)].filter(Boolean))}</section>`;
}
function orderTable(items){return `<div class="table-wrap"><table class="table"><thead><tr><th>Entrega / cliente</th><th>Bairro</th><th>Horário</th><th>Volumes</th><th>Status</th><th></th></tr></thead><tbody>${items.map(o=>`<tr><td><div class="client"><div class="initials">${initials(o.name)}</div><div><strong>${esc(o.name)}</strong><small>${CODE(o.id)}</small>${o.source?.type==='paper-photo'?`<span class="source-badge">${icon('camera',10)} Ficha ${esc(o.source.sheetNumber)}</span>`:''}</div></div></td><td>${esc(o.neighborhood)}</td><td>${icon('clock',12)} &nbsp;${o.window}</td><td><div class="flex gap6">${icon('box',13)} ${o.boxes.length} cx ${tags(o)}</div></td><td>${badge(o.status)}</td><td><button class="btn ghost icon-btn" aria-label="Ver ${CODE(o.id)}" title="Ver entrega" data-action="detail" data-id="${o.id}">${icon('chevron',16)}</button></td></tr>`).join('')}</tbody></table></div>`;}
function entregas(){
 if(state.role==='Atendente')return attendantOrders();

function whatsappNumber(value){
  const raw=String(value||'').trim();
  if(!raw || /[^\d\s()+.\-]/.test(raw))return '';
  let digits=raw.replace(/\D/g,'');
  if(digits.startsWith('0055'))digits=digits.slice(2);
  if((digits.length===12 || digits.length===13) && digits.startsWith('55'))digits=digits.slice(2);
  // Brazilian DDD plus 8-digit landline or 9-digit mobile; exclude demo zeros.
  if(!/^[1-9]\d(?:[2-5]\d{7}|9\d{8})$/.test(digits))return '';
  return '55'+digits;
}

function queueNotice(r,event){const n=nextOrder(r);if(!n)return null;const key=`${r.id}:${n.id}:next`;const existing=state.notifications.find(x=>x.key===key);if(existing)return existing;
 const note={id:'N-'+Date.now()+'-'+Math.floor(Math.random()*1000),key,routeId:r.id,orderId:n.id,name:n.name,phone:n.phone,status:n.consent?'queued':'skipped',event,created:now(),message:messageFor(n),reason:n.consent?'':'Cliente sem autorização para receber a atualização.'};state.notifications.push(note);save();if(note.status==='queued')simulateNote(note.id);return note;

function previousCompleteDelivery(id){const o=order(id),r=route(o?.routeId);if(!o||!r)return false;if(o.status==='delivered'){toast('Esta entrega já foi concluída. Nenhum aviso duplicado.','info');return false;}if(r.status!=='active'||nextOrder(r)?.id!==o.id){toast('Esta não é a próxima parada de uma rota ativa.','alert');return false;}

function previousMakeRoute(){const d=ui.draft;if(!d||!d.orders.length)return;const os=d.orders.map(order);if(os.some(o=>!o||o.status!=='ready'||o.routeId)){toast('Uma entrega já foi atribuída. Revise a seleção.','alert');return;}const v=vehicle(d.vehicleId);if(state.routes.some(r=>r.vehicleId===v.id&&!['finished','draft'].includes(r.status))){toast('Este veículo já está em uma carga ativa.','alert');return;}if(state.routes.some(r=>r.driverId===d.driverId&&!['finished','draft'].includes(r.status))){toast('Este motorista já possui uma viagem. Selecione outro.','alert');return;}if(os.reduce((n,o)=>n+o.boxes.length,0)>v.capacity){toast('A carga ultrapassa a capacidade de referência. Revise a seleção.','alert');return;}const r={id:state.nextRoute++,vehicleId:d.vehicleId,driverId:d.driverId,departure:d.departure,orders:[...d.orders],status:'loading',checked:{},created:now().slice(0,5)};state.routes.push(r);os.forEach(o=>{o.routeId=r.id;o.status='loading';logEvent(o,`Atribuída ao romaneio #${r.id}`);});ui.selected=[];ui.routeId=r.id;ui.draft=null;state.savedDraft=null;save();navigate('romaneio');toast('Romaneio criado. A carga está pronta para conferência.');}

function previousStartRoute(id){const r=route(id);if(r.status!=='released'){toast('A carga precisa ser liberada antes da saída.','alert');return;}r.status='active';r.startedAt=now();routeOrders(r).forEach(o=>{o.status='onroute';logEvent(o,'Viagem iniciada');});const n=queueNotice(r,'rota_iniciada');save();render();toast(n?.status==='skipped'?'Rota iniciada. O primeiro cliente está sem autorização para mensagem.':'Rota iniciada. Primeiro aviso simulado automaticamente.');}
function eventHandler(e){const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,d=el.dataset;const change=e.type==='change';if(e.type==='click'&&['role','volume-order','route-select','loading-select','driver-route','neighborhood','plan-driver','plan-time','check-load','confirm-physical','select-vehicle'].includes(a))return;if(change&&!['role','volume-order','route-select','loading-select','driver-route','neighborhood','plan-driver','plan-time','check-load','confirm-physical','select-vehicle'].includes(a))return;

 if(type==='neighborhood'){if(state.neighborhoods.some(b=>b.name.toLowerCase()===v.name.toLowerCase())){toast('Este bairro já existe.','alert');return;}state.neighborhoods.push({name:v.name,zone:v.zone});}
 if(type==='vehicle'){const cap=Number(v.capacity);if(!Number.isInteger(cap)||cap<1){toast('Informe uma capacidade válida.','alert');return;}if(id){const ve=vehicle(id);Object.assign(ve,{name:v.name,plate:v.plate.trim(),capacity:cap});}else state.vehicles.push({id:Math.max(...state.vehicles.map(x=>x.id))+1,name:v.name,plate:v.plate.trim(),capacity:cap});}

document.addEventListener('input',e=>{
 const el=e.target;if(!ui.volumeDraft || ui.page!=='volumes')return;
 if(el.dataset.boxField==='location'){const original=editableVolumeOrder();if(lockedVolumes(original))return;ui.volumeDraft.boxDetails[el.dataset.code].location=el.value;ui.volumeDirty=true;refreshVolumeEditor(false);}
 if(el.dataset.volumeNumber){const original=editableVolumeOrder();if(lockedVolumes(original))return;ui.volumeDraft[el.dataset.volumeNumber]=el.value===''?0:Number(el.value);ui.volumeDirty=true;refreshVolumeEditor(false);}
});
document.addEventListener('change',e=>{
 const el=e.target;if(el.dataset.boxField!=='type' || !ui.volumeDraft)return;
 const original=editableVolumeOrder();if(lockedVolumes(original))return;
 const info=ui.volumeDraft.boxDetails[el.dataset.code],previous=info.type;info.type=el.value;
 const defaults=['Área de expedição','Câmara fria 01 · Prateleira B','Câmara de congelados · Setor A'];
 if(!info.location || defaults.includes(info.location))info.location=info.type==='ambient'?'Área de expedição':info.type==='frozen'?'Câmara de congelados · Setor A':'Câmara fria 01 · Prateleira B';
 ui.volumeDirty=true;refreshVolumeEditor(true);
 const next=[...document.querySelectorAll('[data-box-field="location"]')].find(input=>input.dataset.code===el.dataset.code);next?.focus();
});

document.addEventListener('dragstart',e=>{const row=e.target.closest('[data-drag-index]');if(!row)return;dragFrom=Number(row.dataset.dragIndex);e.dataTransfer.setData('text/plain',String(dragFrom));e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-drag-index]'))e.preventDefault();});
document.addEventListener('drop',e=>{const row=e.target.closest('[data-drag-index]');if(!row||!ui.draft||dragFrom===null)return;e.preventDefault();const to=Number(row.dataset.dragIndex),arr=ui.draft.orders;arr.splice(to,0,arr.splice(dragFrom,1)[0]);dragFrom=null;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(ui.mobileMenu){ui.mobileMenu=false;render();}}if(e.key==='Tab'&&document.querySelector('.modal')){const els=[...document.querySelectorAll('.modal button:not(:disabled),.modal input:not(:disabled),.modal select:not(:disabled),.modal textarea:not(:disabled),.modal a[href]:not([aria-disabled="true"])')];if(els.length){const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}});
window.addEventListener('hashchange',()=>{const target=location.hash.slice(1).split('?')[0]||'login';if(target===ui.page)return;closeModal();ui.mobileMenu=false;window.scrollTo(0,0);render();});

function ensureSecondPaperNumber(){

 if(ui.paperPairFirst!==first||!ui.paperPairSecond||!state.issuedPaperNumbers.includes(ui.paperPairSecond)){

 }

}

  root.innerHTML=`<div class="paper-pair"><div class="paper-half">${paperSheet(null,first,'blank')}</div><div class="paper-half">${paperSheet(null,second,'blank')}</div><div class="cut-line"><span>CORTE AQUI</span></div></div>`;

async function loadPaperPhoto(file){
 if(!file)return;
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Selecione uma foto JPG, PNG ou WebP. Outros formatos não são aceitos neste protótipo.','alert');return;}
 if(file.size>12*1024*1024){toast('A foto deve ter até 12 MB. Escolha uma versão menor.','alert');return;}
 const replaceId=ui.paperReplaceId;ui.paperReplaceId=null;
 toast('Preparando a foto localmente. Nenhum dado será enviado para um servidor.','camera');
 try{
  const imageURL=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Leitura da foto falhou.'));reader.readAsDataURL(file);});
  const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Imagem ilegível.'));img.src=imageURL;});
  if(image.width<100||image.height<100)throw new Error('A foto é muito pequena. Envie uma imagem legível da ficha completa.');
  const ratio=Math.min(1,1800/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*ratio);canvas.height=Math.round(image.height*ratio);const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Não foi possível preparar a foto neste navegador.');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
  const photo=canvas.toDataURL('image/jpeg',.86);let r=replaceId?paperRecord(replaceId):null;
  if(r?.orderId){toast('Uma ficha já importada não pode ter a foto substituída.','alert');return;}
  if(r){r.photo=photo;r.mode='upload';r.source=null;r.filename=file.name;r.updatedAt=new Date().toISOString();r.status='review';r.data=clonePaper(ui.paper.values||r.data||blankPaperValues());}
  else{r={id:'PHOTO-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),sheetNumber:'',mode:'upload',status:'captured',photo,filename:file.name,source:null,data:null,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),orderId:null};state.paperForms.push(r);}
  safePaperSave();openPaperRecord(r.id);
 }catch(error){toast(error.message||'Não foi possível abrir a foto. Tente outra imagem.','alert');}
}
