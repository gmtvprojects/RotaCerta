name: CI
on:
  pull_request:
    branches: [dev, hml, prod]
  push:
    branches: [dev, hml, prod]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # falha só em vulnerabilidade crítica; as demais aparecem no log e no Dependabot (picomatch/react-router do Ionic ainda sem correção publicada)
      - run: pnpm audit --prod --audit-level=critical
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
